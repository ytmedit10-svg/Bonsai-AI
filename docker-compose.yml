services:
  postgres:
    image: postgres:16
    container_name: node-based-chat-postgres
    environment:
      POSTGRES_DB: node_based_chat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:

